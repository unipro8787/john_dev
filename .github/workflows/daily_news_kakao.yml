name: 경제뉴스 카톡 요약

on:
  # 매일 자동 발송 재개 (사용자 요청, 2026-09-11).
  schedule:
    - cron: "50 23 * * *"  # 매일 23:50 UTC = 08:50 KST
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send daily economic news to KakaoTalk
        working-directory: economic_news
        env:
          # 개별 secret으로 등록했다면 이 3개가 쓰이고, 대신 .env 형식 여러 줄을 통째로
          # 하나의 KAKAO_DATA secret에 등록했다면 daily_news_kakao.py가 그걸 파싱해서 채운다.
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_DATA: ${{ secrets.KAKAO_DATA }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python daily_news_kakao.py
