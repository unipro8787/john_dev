<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>동탄 테니스코트 찾기</title>
<meta name="description" content="동탄 지역 공공 테니스코트 예약 가능 시간대를 한눈에 검색">

<link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="동탄테니스">
<meta name="theme-color" content="#0f6b4f">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
<link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1>🎾 동탄 테니스코트 찾기</h1>
    <p class="subtitle">화성시 통합예약시스템 실시간 조회</p>
  </header>

  <main>
    <section class="panel" id="search-panel">
      <div class="quick-range" id="quick-range" role="group" aria-label="빠른 기간 선택">
        <button type="button" class="chip quick-btn" data-days="1">오늘</button>
        <button type="button" class="chip quick-btn" data-days="3">3일</button>
        <button type="button" class="chip quick-btn" data-days="7">7일</button>
        <button type="button" class="chip quick-btn" data-days="14">14일</button>
        <button type="button" class="chip quick-btn" data-days="30">30일</button>
      </div>

      <div class="date-row">
        <label class="field">
          <span>시작일</span>
          <input type="date" id="start-date">
        </label>
        <label class="field">
          <span>종료일</span>
          <input type="date" id="end-date">
        </label>
      </div>

      <div class="facility-filter" id="facility-filter" aria-label="시설 필터">
        <!-- JS로 채움 -->
      </div>

      <button type="button" id="search-btn" class="search-btn">검색</button>
    </section>

    <section id="status-area" aria-live="polite"></section>

    <section id="results" class="results"></section>
  </main>

  <footer>
    <p>데이터 출처: <a href="https://yeyak.hscity.go.kr" target="_blank" rel="noopener">yeyak.hscity.go.kr</a></p>
  </footer>
</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
